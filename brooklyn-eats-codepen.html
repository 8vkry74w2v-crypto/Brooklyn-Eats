const BM={
  bc:{cls:"bc",label:"📍 Super Close"},
  bl:{cls:"bl",label:"🌙 Late Night"},
  bw:{cls:"bw",label:"⚠️ Verify Range"},
  bp:{cls:"bp",label:"Pickup Only"},
  bcash:{cls:"bcash",label:"💵 Call to Order"},
  bd:{cls:"bd",label:"💰 5% Off Direct"},
  bn:{cls:"bn",label:"✨ New Add"},
  bfee:{cls:"bfee",label:"💸 Service Fee Required"},
};

let af="all";
function setFilter(f,el){af=f;document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));el.classList.add('active');render();}
function toggleMed(btn){const p=btn.nextElementSibling;const o=p.classList.toggle('open');btn.querySelector('.arr').textContent=o?'▴':'▾';}
function toggleMulti(btn){const p=btn.nextElementSibling;const o=p.classList.toggle('open');btn.querySelector('.arr').textContent=o?'▴':'▾';}

function render(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const filtered=R.filter(r=>{
    const mf=af==='all'||
      (af==='nearby'&&r.nearby)||
      (af==='late'&&(r.tags.includes('late')||r.badges.some(b=>b==='bl')))||
      r.tags.includes(af);
    const ms=!q||r.name.toLowerCase().includes(q)||r.cuisine.toLowerCase().includes(q)||r.tags.some(t=>t.includes(q));
    return mf&&ms;
  }).sort((a,b)=>a.dist-b.dist);

  // dedupe by name
  const seen=new Set();
  const deduped=filtered.filter(r=>{if(seen.has(r.name))return false;seen.add(r.name);return true;});

  document.getElementById('bar').textContent=`${deduped.length} spot${deduped.length!==1?'s':''}`;
  const empty=document.getElementById('empty'),cards=document.getElementById('cards');
  if(!deduped.length){empty.style.display='block';cards.innerHTML='';return;}
  empty.style.display='none';

  cards.innerHTML=deduped.map(r=>{
    const badges=r.badges.map(b=>{const m=BM[b];return m?`<span class="badge ${m.cls}">${m.label}</span>`:''}).join('');
    const orderBtn=r.url?`<a href="${r.url}" target="_blank" class="btn bo">🛒 Order</a>`:`<a href="tel:${r.phone}" class="btn bco">📞 Call to Order</a>`;
    const callBtn=r.phone?`<a href="tel:${r.phone}" class="btn bcall">📞</a>`:'';
    const medItems=r.med.map((m,i)=>`<div class="mi"><span class="mr">${i+1}.</span><div><div class="mt">${m.t}</div><div class="ms">${m.s}</div></div></div>`).join('');
    const medHTML=`<div class="med-toggle" onclick="toggleMed(this)"><span>🥗 Top 5 Med Diet Picks</span><span class="arr">▾</span></div><div class="med-panel"><div class="med-title">Closest to Mediterranean Diet</div>${medItems}</div>`;
    let multiHTML='';
    if(r.multi){
      const locItems=r.multi.locs.map((l,i)=>{
        const ob=l.url?`<a href="${l.url}" target="_blank" class="lb lbo">🛒 Order</a>`:'';
        const cb=l.phone?`<a href="tel:${l.phone}" class="lb lbc">📞</a>`:'';
        return`<div class="li"${i>0?' style="border-top:1px solid #2e2c29"':''}><div class="ll">${l.label}</div><div class="la">${l.addr} · ${l.hours}</div><div class="lact">${ob}${cb}</div></div>`;
      }).join('');
      multiHTML=`<div class="mt2" onclick="toggleMulti(this)"><span>${r.multi.label}</span><span class="arr">▾</span></div><div class="mp">${locItems}</div>`;
    }
    return`<div class="card"><div class="cb"><div class="ct"><div class="cn">${r.name}</div><div class="ce">${r.emoji}</div></div><div class="cm"><span class="cc">${r.cuisine}</span><span class="dot"></span><span class="cd">${r.dist} mi</span></div>${badges?`<div class="badges">${badges}</div>`:''}<div class="ca">${r.address}</div><div class="ch">${r.hours}</div>${r.notes?`<div class="cno">${r.notes}</div>`:''}<div class="actions">${orderBtn}${callBtn}</div></div>${medHTML}${multiHTML}</div>`;
  }).join('');
}
render();
